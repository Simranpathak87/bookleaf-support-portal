spring.application.name=bookleaf

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookleaf}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=jwt.secret=MyJavaJwtSecretKey2026SecureRandomKey123456
jwt.expiration-ms=86400000

ai.provider=${AI_PROVIDER:ollama}
ai.base-url=${AI_BASE_URL:http://localhost:11434}
ai.model=${AI_MODEL:phi3:mini}
ai.api-key=${AI_API_KEY:}
ai.timeout-seconds=120

server.port=${PORT:8080}